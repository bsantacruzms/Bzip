name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build portable exes and MSI installer
        shell: pwsh
        run: |
          ./scripts/build-release.ps1
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix build installers/windows/BoltZip.wxs -ext WixToolset.UI.wixext -arch x64 -o dist/BoltZip-1.1.2.msi
      - name: Build branded setup.exe (bootstrapper)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          wix build installers/windows/Bundle.wxs -ext WixToolset.BootstrapperApplications.wixext -o dist/BoltZip-1.1.2-setup.exe
      - name: Publish Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.msi
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build .app bundle and .dmg
        run: bash scripts/build-macos.sh
      - name: Publish macOS artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install packaging tools (fpm + rpmbuild)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo gem install --no-document fpm
      - name: Build tarball, .deb and .rpm
        run: bash scripts/build-linux.sh
      - name: Publish Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  # Publishes SHA256SUMS.txt covering every artifact, so downloads (including the
  # curl | sh installer) can be verified before anything is installed.
  checksums:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Collect release assets and hash them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p assets && cd assets
          gh release download "$TAG" --repo "$REPO" --pattern '*'
          # Hash every artifact except the checksum file itself.
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish checksums
        uses: softprops/action-gh-release@v2
        with:
          files: assets/SHA256SUMS.txt
