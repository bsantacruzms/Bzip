name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build BoltZip.sln -c Release

      - name: Test
        run: dotnet test tests/BoltZip.Core.Tests/BoltZip.Core.Tests.csproj -c Release
